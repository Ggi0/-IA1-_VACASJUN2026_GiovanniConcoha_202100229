services:

  db-bot:

    image: postgres:17

    container_name: db-bot

    restart: unless-stopped

    environment:
      POSTGRES_DB: smartbot
      POSTGRES_USER: smartbot_user
      POSTGRES_PASSWORD: smartbot_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:

    build:
      context: ./backend

    container_name: backend-bot

    restart: unless-stopped

    depends_on:
      - db-bot

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db-bot
      DB_PORT: 5432

      DB_NAME: smartbot

      DB_USER: smartbot_user
      DB_PASSWORD: smartbot_password

  frontend:

    build:
      context: ./frontend

    container_name: frontend-bot

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: